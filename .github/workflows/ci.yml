name: ATLAS P0 quality gate
on:
  push:
    branches: ['fix/atlas-p0-stabilization']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify syntax
        run: npm run check
      - name: Run unit and structural tests
        run: npm test
