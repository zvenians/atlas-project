name: ATLAS quality gate
on:
  push:
    branches: ['fix/atlas-p0-stabilization', 'feat/atlas-true-3d-visual-upgrade']
  pull_request:
    branches: ['main', 'fix/atlas-p0-stabilization']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify syntax
        run: npm run check
      - name: Run unit and structural tests
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium smoke tests
        run: node tests/browser-smoke.mjs
      - name: Capture responsive QA screenshots and legacy workflows
        run: node tests/qa-evidence.mjs
      - name: Capture True 3D visual evidence and camera tracking
        run: node tests/3d-evidence.mjs
      - name: Upload visual QA evidence (not design approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-qa-${{ github.run_id }}
          path: |
            artifacts/p0-browser/
            artifacts/3d-qa/
          retention-days: 7
          if-no-files-found: warn
